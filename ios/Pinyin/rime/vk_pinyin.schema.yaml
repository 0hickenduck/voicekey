schema:
  schema_id: vk_pinyin
  name: 全拼
  version: "2"
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/ # 响应超级简拼，取消「噷 hm」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^m$/  # 响应超级简拼，取消「呣 m」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^n$/  # 响应超级简拼，取消「嗯 n」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^ng$/ # 响应超级简拼，取消「嗯 ng」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - abbrev/^([a-z]).+$/$1/   # 超级简拼
    - abbrev/^([zcs]h).+$/$1/  # 超级简拼中，zh ch sh 视为整体（ch'sh → 城市），而不是像这样分开（c'h's'h → 吃好睡好）。
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/
    # 拼写纠错（correction 标签：降权 1%，与 enable_correction 的邻键替换互补）
    # librime NearSearchCorrector 只支持单键替换；这里补齐它不支持的手滑模式：
    # 转置（尾部两键敲反）
    - derive/([bpmfdtljqxywr])ing$/$1ign/correction
    - derive/([bpmfdtlngkhzhcsr])eng$/$1egn/correction
    - derive/([bpmfdtljqx])iao$/$1ioa/correction
    - derive/([bpmfdtljqx])iang$/$1iagn/correction
    - derive/([mdtgkhzhcsr])ang$/$1agn/correction
    - derive/([mdtgkhzhcsr])ang$/$1nag/correction
    - derive/([bpmfdtljqx])ian$/$1ain/correction   # tain → tian（尾三键循环错位）
    # 多敲 n/g（鼻音重复）
    - derive/([bpmfdtljqxywr])ing$/$1inng/correction
    - derive/([bpmfdtlngkhzhcsrw])eng$/$1enng/correction
    - derive/([mdtgkhzhcsr])ang$/$1anng/correction
    # 漏字母（n/g 漏敲）
    - derive/([bpmfdtljqxywr])in$/$1ing/correction
    - derive/([jqxl])ing$/$1ng/correction    # jng → jing（漏敲 i）
    - derive/([bpmfdtlngkhzhcsr])en$/$1eng/correction
    - derive/([mdtgkhzhcsrzcyw])an$/$1ang/correction
    - derive/([mdtgkhzhcsrzcyw])ang$/$1an/correction
translator:
  dictionary: vk
  enable_word_completion: true
  enable_user_dict: true
  enable_correction: true # librime corrector：QWERTY 邻键 + 受限编辑距离（含转置），仅对无法精确切分的音节生效，固定降权
  contextual_suggestions: true # 八股文语言模型参与候选排序
  max_homophones: 7
  max_homographs: 7
menu:
  page_size: 20
grammar:
  language: zh-hans-t-essay-bgw # 八股文语言模型（简体词级 bigram）
  collocation_max_length: 4
  collocation_min_length: 3
